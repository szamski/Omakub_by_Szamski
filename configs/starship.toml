"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](pink)\
$os\
$username\
[](bg:teal fg:pink)\
$directory\
[](bg:peach fg:teal)\
$git_branch\
$git_status\
[](fg:peach bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:mauve)\
$time\
[ ](fg:mauve)\
$cmd_duration\
$line_break\
$character"""

palette = 'ptyxis_dark'

[os]
disabled = false
style = "bg:pink fg:base"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:pink fg:base"
style_root = "bg:pink fg:base"
format = '[ $user]($style)'

[directory]
style = "bg:teal fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:peach"
format = '[[ $symbol $branch ](fg:base bg:peach)]($style)'

[git_status]
style = "bg:peach"
format = '[[($all_status$ahead_behind )](fg:base bg:peach)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:base bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:base bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:base bg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:base bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:mauve"
format = '[[  $time ](fg:base bg:mauve)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:pink)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:mauve)'
vimcmd_replace_symbol = '[❮](bold fg:mauve)'
vimcmd_visual_symbol = '[❮](bold fg:peach)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:mauve"
disabled = false
show_notifications = true
min_time_to_notify = 45000

# Custom Ptyxis Dark palette - balanced colors for dark purple background
[palettes.ptyxis_dark]
# Balanced colors with good contrast but not overly bright
pink = "#f5c2e7"           # Soft pink for username (more pastel)
mauve = "#cba6f7"          # Purple for time
teal = "#94e2d5"           # Teal/cyan for directory
peach = "#f9e2af"          # Soft yellow for git (not orange!)
green = "#a6e3a1"          # Soft green for languages
sapphire = "#89dceb"       # Sky blue for conda/docker
red = "#f38ba8"            # Soft red for errors

# Dark background (matching Ptyxis purple theme)
base = "#11111b"           # Very dark (crust from catppuccin)
crust = "#11111b"          # Very dark
